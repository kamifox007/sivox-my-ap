<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStream | Experience Harmony</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-wave-square"></i>
                <span>MusicStream</span>
            </div>
            
            <nav class="nav-menu">
                <button class="nav-item active" data-page="home">
                    <i class="fas fa-home"></i> Home
                </button>
                <button class="nav-item" data-page="discover">
                    <i class="fas fa-compass"></i> Discover
                </button>
                <button class="nav-item" data-page="library">
                    <i class="fas fa-layer-group"></i> Library
                </button>
            </nav>

            <div class="playlist-section">
                <span class="section-label">Your Playlists</span>
                <ul class="playlist-list" id="sidebarPlaylists">
                    <!-- Dynamic playlists -->
                </ul>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-view scroller">
            <header class="top-bar">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search for tracks, artists...">
                </div>
                <div class="user-actions">
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop" alt="User" class="avatar">
                </div>
            </header>

            <div id="content-container">
                <!-- Home Page -->
                <section id="home" class="page active">
                    <div class="hero">
                        <div class="hero-bg" style="background-image: url('hero.png');"></div>
                        <div class="hero-overlay"></div>
                        <div class="hero-content">
                            <span style="background: var(--secondary); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; margin-bottom: 12px; display: inline-block;">NEW RELEASE</span>
                            <h1>Digital Dreams</h1>
                            <p>Premium atmospheric soundscapes for the modern era.</p>
                            <button class="btn-play">Listen Now</button>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-header-row">
                            <h2>Recommended For You</h2>
                            <a href="#" class="view-all">View All</a>
                        </div>
                        <div class="card-grid" id="recommendedGrid">
                            <!-- Cards injected by app.js -->
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-header-row">
                            <h2>Top Trending</h2>
                        </div>
                        <div class="card-grid" id="trendingGrid">
                            <!-- Cards injected by app.js -->
                        </div>
                    </div>
                </section>

                <!-- Discover Page -->
                <section id="discover" class="page">
                    <div class="section">
                        <h2>Genres & Moods</h2>
                        <div class="card-grid" id="genreGrid" style="margin-top: 24px;">
                            <!-- Genre cards injected by app.js -->
                        </div>
                    </div>
                </section>

                <!-- Library Page -->
                <section id="library" class="page">
                    <div class="section-header-row">
                        <h2>Your Collections</h2>
                        <button class="btn-play" id="createPlaylistBtn" style="padding: 10px 24px;">+ New Playlist</button>
                    </div>
                    <div id="playlistContainer" style="margin-top: 24px;">
                        <!-- Playlist items injected by app.js -->
                    </div>
                </section>
            </div>
        </main>

        <!-- Global Player Bar -->
        <footer class="player">
            <div class="track-info">
                <img id="playerTrackArt" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=100&h=100&fit=crop" alt="Art">
                <div class="track-details">
                    <h4 id="playerTrackTitle">Not Playing</h4>
                    <p id="playerTrackArtist">Select a track</p>
                </div>
                <button class="btn-icon" style="margin-left: 12px;"><i class="far fa-heart"></i></button>
            </div>

            <div class="controls">
                <div class="control-btns">
                    <button class="btn-icon"><i class="fas fa-random"></i></button>
                    <button class="btn-icon" id="prevTrackBtn"><i class="fas fa-step-backward"></i></button>
                    <button class="btn-icon btn-play-circle" id="globalPlayBtn"><i class="fas fa-play"></i></button>
                    <button class="btn-icon" id="nextTrackBtn"><i class="fas fa-step-forward"></i></button>
                    <button class="btn-icon"><i class="fas fa-redo"></i></button>
                </div>
                <div class="progress-container">
                    <span class="time" id="currentTime">0:00</span>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span class="time" id="totalTime">3:45</span>
                </div>
            </div>

            <div class="volume-container">
                <i class="fas fa-volume-up" style="color: var(--text-dim); font-size: 0.9rem;"></i>
                <div class="volume-bar" id="volumeBar">
                    <div class="volume-fill" id="volumeFill"></div>
                </div>
                <button class="btn-icon" style="margin-left: 20px;"><i class="fas fa-list-ul"></i></button>
            </div>
        </footer>
    </div>

    <!-- Background Audio Element -->
    <audio id="audioPlayer"></audio>

    <script src="app.js" type="module"></script>
</body>
</html>
