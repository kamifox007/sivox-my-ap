name: "Build iOS IPA"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Release
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Set specific version if needed:
          # flutter-version: '3.21.0'

      - name: Install Dependencies
        run: flutter pub get

      - name: Disable Swift Package Manager in Flutter
        run: flutter config --no-enable-swift-package-manager

      - name: Build iOS Archive (Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Create IPA Placeholder
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r Runner.ipa Payload
          cd ../../..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: build/ios/iphoneos/Runner.ipa
          if-no-files-found: error
          retention-days: 7
